[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "py-equilab"
version = "0.1.0"
description = "Async, read-only Python client for the unofficial Equilab cloud API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Daniel Wilson", email = "hello@danw.io" }]
keywords = ["equilab", "equestrian", "asyncio", "home-assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.11.0,<4"]

[project.urls]
Homepage = "https://github.com/Danw33/py-equilab"
Repository = "https://github.com/Danw33/py-equilab"
Issues = "https://github.com/Danw33/py-equilab/issues"
Changelog = "https://github.com/Danw33/py-equilab/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
  "mypy==1.18.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyequilab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["pyequilab"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pyequilab"]
mypy_path = "src"
